[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowctl"
version = "0.1.0"
description = "ASIC flow automation CLI tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "rich>=13.0",
]

[project.scripts]
flowctl = "flowctl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowctl*"]
