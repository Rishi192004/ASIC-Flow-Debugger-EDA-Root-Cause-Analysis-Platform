project: my_design

rtl:
  sources:
    - examples/rtl/*.sv
  top: alu_top

stages:
  - lint
  - sim
  - synth
  - report

tools:
  lint:
    adapter: verible
  sim:
    adapter: verilator
    testbench: examples/rtl/alu_tb.sv
  synth:
    adapter: yosys
    target: generic
  report:
    adapter: report
